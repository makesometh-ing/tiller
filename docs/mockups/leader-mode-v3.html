<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  .mock { margin: 0 0 30px; }
  .label { font: 600 14px/1.3 var(--font-sans, -apple-system); margin: 0 0 4px; }
  .note { font: 13px/1.45 var(--font-sans, -apple-system); color: var(--muted-foreground, #999); margin: 0 0 10px; }
  .pair { display: grid; gap: 10px; }
  .tag { font: 600 11px/1 var(--font-sans, -apple-system); color: var(--muted-foreground, #999); margin: 2px 0 6px; }

  /* Theme tokens. The app reads the same values from one theme type. */
  .dark {
    --wall: radial-gradient(120% 80% at 20% 15%, #7b5cff 0%, transparent 55%), radial-gradient(90% 70% at 85% 20%, #ff7ab8 0%, transparent 50%), linear-gradient(160deg, #4a3bb8, #23194f);
    --win: #1e1e24; --win-back: #2c2c36; --win-bar: #2a2a31; --win-line: rgba(255,255,255,.08); --win-border: rgba(255,255,255,.1);
    --glass: rgba(28,26,38,.68); --glass-border: rgba(255,255,255,.16); --text: #f4f4f6; --muted: rgba(255,255,255,.55);
    --key-bg: rgba(255,255,255,.13); --key-border: rgba(255,255,255,.2);
    --accent: #3fd6c4; --tint: rgba(63,214,196,.10); --tint-focus: rgba(63,214,196,.17); --edge: rgba(63,214,196,.5); --edge-focus: rgba(63,214,196,.95);
    --menubar: rgba(20,14,40,.35); --menutext: #fff;
  }
  .light {
    --wall: radial-gradient(120% 80% at 20% 15%, #c9bcff 0%, transparent 55%), radial-gradient(90% 70% at 85% 20%, #ffd0e6 0%, transparent 50%), linear-gradient(160deg, #e9e4ff, #cfc6f2);
    --win: #ffffff; --win-back: #ececf1; --win-bar: #f3f3f6; --win-line: rgba(0,0,0,.08); --win-border: rgba(0,0,0,.12);
    --glass: rgba(255,255,255,.72); --glass-border: rgba(0,0,0,.1); --text: #1d1d22; --muted: rgba(0,0,0,.5);
    --key-bg: rgba(0,0,0,.06); --key-border: rgba(0,0,0,.14);
    --accent: #0f9e8e; --tint: rgba(15,158,142,.08); --tint-focus: rgba(15,158,142,.14); --edge: rgba(15,158,142,.45); --edge-focus: rgba(15,158,142,.9);
    --menubar: rgba(255,255,255,.45); --menutext: #1d1d22;
  }

  .dark { --blue: #6fa8ff; --purple: #b48cff; --neutral: #5b5b66; --blue-tint: rgba(111,168,255,.14); --purple-tint: rgba(180,140,255,.14); }
  .light { --blue: #3b7cf0; --purple: #8b5cf6; --neutral: #8e8e99; --blue-tint: rgba(59,124,240,.10); --purple-tint: rgba(139,92,246,.10); }
  .chip.solid { color: #fff; border: 0; box-shadow: 0 4px 14px rgba(0,0,0,.3); padding: 3px 4px 3px 7px; font-size: 9px; }
  .chip.solid .cn { font-weight: 800; opacity: .75; }
  .chip.solid .dot { opacity: .6; }
  .chip.solid .key.dark-key { background: rgba(0,0,0,.22); border-color: rgba(255,255,255,.35); color: #fff; }
  .tip { padding: 3px 6px; border-radius: 6px; font-size: 8.5px; white-space: nowrap; z-index: 30; }
  .desk { position: relative; width: 712px; height: 445px; border-radius: 12px; overflow: hidden; background: var(--wall); color: var(--text); }
  .menubar { position: absolute; inset: 0 0 auto 0; height: 22px; background: var(--menubar); backdrop-filter: blur(20px);
    color: var(--menutext); font-size: 11px; display: flex; align-items: center; gap: 14px; padding: 0 12px; z-index: 1; }
  .menubar .right { margin-left: auto; }
  .win { position: absolute; border-radius: 9px; background: var(--win); box-shadow: 0 8px 24px rgba(0,0,0,.35);
    border: 1px solid var(--win-border); overflow: hidden; }
  .win.back { background: var(--win-back); }
  .win .bar { height: 20px; background: var(--win-bar); display: flex; gap: 5px; align-items: center; padding-left: 8px; font-size: 10px; color: var(--muted); }
  .win .bar i { width: 7px; height: 7px; border-radius: 50%; display: block; }
  .win .bar i:nth-child(1) { background: #ff5f57; } .win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
  .win .bar span { margin-left: 10px; }
  .win .body { padding: 12px; display: grid; gap: 7px; }
  .win .body b { height: 6px; border-radius: 3px; background: var(--win-line); display: block; }
  .win .body b:nth-child(3n) { width: 60%; }

  .abs { position: absolute; z-index: 20; }
  .glass { background: var(--glass); backdrop-filter: blur(24px) saturate(170%); border: 1px solid var(--glass-border);
    box-shadow: 0 8px 28px rgba(0,0,0,.25); color: var(--text); }
  .key { display: inline-flex; align-items: center; justify-content: center; min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 4px; font: 600 8.5px/1 ui-monospace, "SF Mono", monospace; color: var(--text); background: var(--key-bg); border: 1px solid var(--key-border); }
  .muted { color: var(--muted); }
  .sep { width: 1px; height: 14px; background: var(--key-border); }

  /* Bottom bar: mockup B with fonts 1 pt smaller and a drag handle. */
  .bar { display: flex; align-items: center; gap: 8px; padding: 5px 9px 5px 6px; border-radius: 12px; font-size: 9px; white-space: nowrap; }
  .bar .grip { width: 6px; height: 14px; background-image: radial-gradient(var(--muted) 1px, transparent 1.2px); background-size: 3px 3.5px; opacity: .8; cursor: grab; }
  .bar .it { display: flex; align-items: center; gap: 3px; }
  .bar b.brand { color: var(--accent); font-size: 8.5px; letter-spacing: .05em; }

  /* Container chip: same style as the bottom bar. */
  .chip { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 9px; font-size: 9px; font-weight: 600; white-space: nowrap; }
  .chip .n { color: var(--accent); }

  /* Window pill: small, translucent, only in leader key mode. */
  .pill { display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 3px; border-radius: 7px; font-size: 8.5px; white-space: nowrap; opacity: .9; }
  .pill img { width: 12px; height: 12px; display: block; }
  .pill .t { max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
  .pill .state { display: inline-flex; align-items: center; gap: 2px; padding: 1px 4px; border-radius: 4px; background: var(--key-bg); font-weight: 600; }
  .pill .state.float { color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--key-border); border-radius: 5px; overflow: hidden; }
  .seg span { padding: 1px 4px; font-weight: 600; color: var(--muted); }
  .seg span.on { background: var(--accent); color: #fff; }
  .mini { padding: 1px; border-radius: 4px; }
  .mini img { width: 11px; height: 11px; display: block; }
</style>
</head>

  const mini = w => `<div class="mini glass"><img src="${ICON(w.app)}"></div>`;
