<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  .mock { margin: 0 0 30px; }
  .label { font: 600 14px/1.3 var(--font-sans, -apple-system); margin: 0 0 4px; }
  .note { font: 13px/1.45 var(--font-sans, -apple-system); color: var(--muted-foreground, #999); margin: 0 0 10px; }
  .tag { font: 600 11px/1 var(--font-sans, -apple-system); color: var(--muted-foreground, #999); margin: 8px 0 6px; }

  .dark { --wall: linear-gradient(160deg, #4a3bb8, #23194f); --win: #232228; --side: #1d1c22; --group: #2c2b32; --line: rgba(255,255,255,.07);
    --text: #f2f2f5; --muted: rgba(255,255,255,.5); --field: #3a3940; --field-text: #e8e8ec; --empty: #2f2e35; --empty-text: rgba(255,255,255,.42);
    --sel: rgba(255,255,255,.08); --accent: #3fd6c4; --key: rgba(255,255,255,.1); --key-text: #d8d8de; --btn: #3a3940; }
  .light { --wall: linear-gradient(160deg, #e9e4ff, #cfc6f2); --win: #f6f6f8; --side: #ececf0; --group: #ffffff; --line: rgba(0,0,0,.07);
    --text: #1d1d22; --muted: rgba(0,0,0,.5); --field: #e4e4e8; --field-text: #2a2a30; --empty: #f0f0f3; --empty-text: rgba(0,0,0,.4);
    --sel: rgba(0,0,0,.06); --accent: #0f9e8e; --key: rgba(0,0,0,.07); --key-text: #3a3a40; --btn: #ffffff; }

  .desk { width: 712px; padding: 22px 0; border-radius: 12px; background: var(--wall); display: flex; justify-content: center; }
  .win { width: 640px; height: 640px; border-radius: 12px; overflow: hidden; background: var(--win); color: var(--text); display: flex;
    box-shadow: 0 20px 50px rgba(0,0,0,.4); border: 1px solid var(--line); font-size: 12px; position: relative; }
  .lights { position: absolute; left: 14px; top: 14px; display: flex; gap: 7px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }

  .side { width: 172px; background: var(--side); padding: 44px 8px 10px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
  .nav { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; }
  .nav.on { background: var(--sel); }
  .ico { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
  .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .title { font-size: 15px; font-weight: 700; padding: 13px 20px 8px; }
  .content { padding: 4px 20px 20px; overflow: hidden; }
  .sec { font-size: 12px; font-weight: 700; margin: 12px 2px 6px; display: flex; align-items: center; gap: 6px; }
  .sec .sub { font-weight: 400; color: var(--muted); }
  .group { background: var(--group); border-radius: 9px; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; min-height: 22px; }
  .row + .row { border-top: 1px solid var(--line); }
  .help { color: var(--muted); font-size: 10.5px; padding: 0 10px 8px; margin-top: -3px; }

  /* Shortcut recorder, after Rectangle Pro: a field with the keys, and a clear button. */
  .rec { display: flex; align-items: center; gap: 5px; }
  .field { width: 150px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600;
    background: var(--field); color: var(--field-text); letter-spacing: .04em; }
  .field.empty { background: var(--empty); color: var(--empty-text); font-weight: 500; letter-spacing: 0; }
  .field.live { background: var(--empty); color: var(--accent); box-shadow: 0 0 0 2px var(--accent); font-weight: 500; letter-spacing: 0; }
  .x { width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; }
  .field.small { width: 46px; }
  .key { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 5px;
    background: var(--key); color: var(--key-text); font-size: 10.5px; font-weight: 500; }
  .field.caps { background: transparent; gap: 3px; justify-content: flex-end; }

  .tabs { display: flex; justify-content: center; gap: 4px; padding: 34px 0 8px; border-bottom: 1px solid var(--line); background: var(--side); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 10px; border-radius: 7px; font-size: 10.5px; color: var(--muted); }
  .tab.on { background: var(--sel); color: var(--text); }
  .tab .ico { width: 22px; height: 22px; }

  .hero { display: flex; align-items: center; gap: 10px; padding: 12px; }
  .hero .big { display: flex; gap: 5px; }
  .hero .big .key { min-width: 28px; height: 28px; font-size: 13px; border-radius: 7px; padding: 0 8px; }
  .hero .txt { flex: 1; min-width: 0; }
  .hero .txt b { display: block; font-size: 13px; margin-bottom: 2px; }
  .hero .txt span { color: var(--muted); font-size: 11px; }
  .btn { padding: 4px 10px; border-radius: 6px; background: var(--btn); border: 1px solid var(--line); font-size: 11.5px; font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .grid2 .row { border-top: 1px solid var(--line); }
  .grid2 .row:nth-child(-n+2) { border-top: 0; }

  .cols { display: flex; gap: 8px; align-items: center; }
  .colhead { display: flex; justify-content: flex-end; gap: 8px; padding: 0 10px 4px; font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .colhead span { width: 125px; text-align: center; }
  .f2 { width: 104px; }
  .link { color: var(--accent); font-size: 11.5px; font-weight: 500; }
  .sub2 { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .seg { display: inline-flex; background: var(--field); border-radius: 7px; padding: 2px; font-size: 11px; }
  .seg span { padding: 3px 12px; border-radius: 5px; color: var(--muted); }
  .seg span.on { background: var(--btn); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.2); font-weight: 600; }
  .toggle { width: 30px; height: 17px; border-radius: 9px; position: relative; display: inline-block; }
  .toggle i { position: absolute; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .menu { width: 230px; border-radius: 10px; padding: 5px; font-size: 12.5px; color: var(--text); background: var(--menu); backdrop-filter: blur(20px);
    border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .menu .mi { padding: 4px 9px; border-radius: 5px; display: flex; align-items: center; gap: 7px; }
  .menu .mi.hl { background: #2b74e8; color: #fff; }
  .menu .sepm { height: 1px; background: var(--line); margin: 4px 6px; }
  .menu .dim { color: var(--muted); }
  .menu .sc { margin-left: auto; color: var(--muted); }
  .dark { --menu: rgba(40,39,46,.92); } .light { --menu: rgba(246,246,248,.94); }
  .menubar { height: 22px; display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 0 14px; font-size: 11px; color: #fff; background: rgba(20,14,40,.35); }
  .row2 { display: flex; gap: 18px; align-items: flex-start; justify-content: center; }
</style>
<style>
  .pop { display: inline-flex; align-items: center; gap: 8px; padding: 3px 6px 3px 10px; border-radius: 6px; background: var(--btn); border: 1px solid var(--line);
    font-size: 11.5px; box-shadow: 0 1px 1px rgba(0,0,0,.12); }
  .pop .chev { width: 15px; height: 15px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 8px; display: flex; align-items: center; justify-content: center; line-height: .9; }
  .opts { display: flex; gap: 8px; padding: 8px 10px 10px; }
  .opt { flex: 1; border-radius: 8px; border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--text); font-weight: 600; }
  .scr { width: 92px; height: 56px; border-radius: 5px; background: var(--wall); position: relative; overflow: hidden; }
  .scr .bar { position: absolute; left: 0; right: 0; top: 0; height: 7px; background: rgba(255,255,255,.35); }
  .scr .mb { position: absolute; right: 6px; top: 1px; width: 5px; height: 5px; border-radius: 1px; background: var(--accent); }
  .scr .dock { position: absolute; left: 22px; right: 22px; bottom: 3px; height: 9px; border-radius: 3px; background: rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; gap: 2px; }
  .scr .dock i { width: 5px; height: 5px; border-radius: 1.5px; background: rgba(255,255,255,.6); display: block; }
  .scr .dock i.t { background: var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const icon = (bg, glyph) => `<span class="ico" style="background:${bg}">${glyph}</span>`;
  const nav = [['General', '#8e8e93', '⚙'], ['Shortcuts', '#636366', '⌘']];
  const sidebar = on => `<div class="side">${nav.map(([n, c, g]) => `<div class="nav ${n === on ? 'on' : ''}">${icon(c, g)}${n}</div>`).join('')}
      <div style="flex:1"></div><div class="nav">${icon('#8e8e93', 'i')}About</div></div>`;
  const lights = `<div class="lights"><i></i><i></i><i></i></div>`;
  const toggle = on => `<span class="toggle" style="background:${on ? 'var(--accent)' : 'var(--field)'}"><i style="${on ? 'right' : 'left'}:2px"></i></span>`;
  const app = `<div class="sec">App</div><div class="group"><div class="row"><span>Open at login</span>${toggle(false)}</div>
      <div class="row"><span>Enable Tiller</span>${toggle(true)}</div>
      <div class="help">When Tiller is off, the leader key and the global shortcuts pass to the focused app. Windows stay where they are.</div></div>`;
  const help = `<div class="help">With "Dock only", click the Tiller icon in the Dock to open the settings. The Dock menu of Tiller contains "Enable Tiller".</div>`;
  const page = (show, h = 420) => `<div class="win" style="height:${h}px">${lights}${sidebar('General')}<div class="main"><div class="title">General</div><div class="content">${app}
      <div class="sec">Menu bar and Dock</div><div class="group">${show}</div></div></div></div>`;

  // Variant 1: a pop-up button in one row.
  const v1 = page(`<div class="row"><span>Show Tiller in</span><span class="pop">Menu bar only<span class="chev">▴<br>▾</span></span></div>${help}`);

  // Variant 2: a segmented control in one row.
  const v2 = page(`<div class="row"><span>Show Tiller in</span><span class="seg"><span class="on">Menu bar</span><span>Dock</span><span>Both</span></span></div>${help}`);

  // Variant 3: three cards with a small picture of the screen.
  const scr = (mb, dock) => `<div class="scr"><div class="bar"></div>${mb ? '<div class="mb"></div>' : ''}<div class="dock"><i></i><i></i>${dock ? '<i class="t"></i>' : ''}<i></i></div></div>`;
  const v3 = page(`<div class="opts"><div class="opt on">${scr(true, false)}Menu bar only</div><div class="opt">${scr(false, true)}Dock only</div><div class="opt">${scr(true, true)}Menu bar and Dock</div></div>${help}`, 480);

  const variants = [
    ['Variant 1: pop-up button', 'One row with a pop-up button. The menu of the button lists "Menu bar only", "Dock only" and "Menu bar and Dock". This is the control in the macOS System Settings for a choice of three or more.', v1],
    ['Variant 2: segmented control', 'One row with three segments: Menu bar, Dock and Both. All three choices are visible without a click.', v2],
    ['Variant 3: picture cards', 'Three cards. Each card has a small picture of the screen with the Tiller icon in the menu bar, in the Dock, or in both. The teal mark is the Tiller icon.', v3],
  ];
  const both = w => `<p class="tag">Dark</p><div class="desk dark">${w}</div><p class="tag">Light</p><div class="desk light">${w}</div>`;
  document.getElementById('root').innerHTML = variants.map(([t, n, w]) => `<div class="mock"><p class="label">${t}</p><p class="note">${n}</p>${both(w)}</div>`).join('');
</script>
</body>
</html>
